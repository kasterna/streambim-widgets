<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <title>Falsk StreamBIM-visning</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body { font-family: Arial, sans-serif; font-size: 13px; background: #1d2023; color: #eee; display: flex; flex-direction: column; }
    #camera { padding: 6px 10px; color: #ffd76a; }
    #view { flex: 1; overflow: auto; padding: 10px; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 6px; }
    .tile { font-size: 11px; padding: 6px 8px; border-radius: 4px; border: 2px solid transparent; cursor: pointer; background: #6b7680; color: #fff; }
    .tile.kind-ReinforcingBar { background: #b5651d; }
    .tile.kind-ReinforcingMesh { background: #8a5a9e; }
    .tile.highlighted { border-color: #ffd76a; box-shadow: 0 0 0 2px #ffd76a; }
    .tile.faded { opacity: 0.25; }
  </style>
</head>
<body>
  <div id="camera"></div>
  <div id="view"></div>

  <script src="../vendor/streambim-widget-api.min.js"></script>
  <script src="mock-model.js"></script>
  <script src="mock-api.js"></script>
  <script>
    /* Spiller rollen som StreamBIM i embedded-modus for streambim-host.html: kobler seg
     * til forelderen med connectToParent() og svarer på API-kallene med mock-data. */
    (function () {
      const viewEl = document.getElementById("view");
      const cameraEl = document.getElementById("camera");
      const mock = MockApi.createMockApi(MockApi.readSettings(new URLSearchParams(location.search)), () => render());

      function render() {
        MockApi.renderMockView(mock, viewEl, cameraEl, (obj) => {
          MockApi.pickObject(mock, obj, StreamBIM.API);
          render();
        });
      }

      render();
      // I "Eget vindu"-modus er testsiden opener, ikke parent.
      StreamBIM.connectToParent(window.opener || window.parent, mock.methods);
    })();
  </script>
</body>
</html>
