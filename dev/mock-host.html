<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <title>StreamBIM mock-vert</title>
  <script type="importmap">
    {
      "imports": {
        "three": "../node_modules/three/build/three.module.js",
        "three/addons/": "../node_modules/three/examples/jsm/"
      }
    }
  </script>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      font-family: Arial, sans-serif;
      font-size: 13px;
      display: flex;
      background: #2b2f33;
      color: #eee;
    }
    #panel {
      width: 380px;
      flex: 0 0 380px;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #444;
    }
    #panel h2 { font-size: 13px; margin: 8px 10px; color: #aaa; font-weight: normal; }
    #widget-frame { flex: 1; border: 0; background: transparent; }
    #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    #controls {
      padding: 8px 10px;
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      align-items: center;
      border-bottom: 1px solid #444;
    }
    #camera { padding: 6px 10px; color: #ffd76a; }
    #view {
      flex: 1;
      overflow: auto;
      padding: 10px;
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 6px;
    }
    #view.three { display: block; padding: 0; overflow: hidden; position: relative; }
    #view.three canvas { display: block; }
    .tile {
      font-size: 11px;
      padding: 6px 8px;
      border-radius: 4px;
      border: 2px solid transparent;
      cursor: pointer;
      background: #6b7680;
      color: #fff;
    }
    .tile.kind-ReinforcingBar { background: #b5651d; }
    .tile.kind-ReinforcingMesh { background: #8a5a9e; }
    .tile.highlighted { border-color: #ffd76a; box-shadow: 0 0 0 2px #ffd76a; }
    .tile.faded { opacity: 0.25; }
    #calls {
      height: 160px;
      overflow: auto;
      margin: 0;
      padding: 6px 10px 6px 28px;
      font-family: Consolas, monospace;
      font-size: 11px;
      border-top: 1px solid #444;
      color: #9fd3c7;
    }
  </style>
</head>
<body>
  <div id="panel">
    <h2>Widget-panel (iframe) · <span id="host-status">kobler til...</span></h2>
    <iframe id="widget-frame" title="Widget"></iframe>
  </div>
  <div id="main">
    <div id="controls">
      <label>Modell
        <select data-setting="model" id="model-select">
          <option value="testdata">Oppdiktet testdata (knapper)</option>
        </select>
      </label>
      <label>Egenskapsformat
        <select data-setting="format">
          <option value="streambim">som ekte StreamBIM (groups)</option>
          <option value="flat">flat, array-verdier</option>
          <option value="tilde">Pset~Egenskap</option>
          <option value="nested">nestede Pset-objekter</option>
        </select>
      </label>
      <label><input type="checkbox" data-setting="findfilter" /> findObjects filtrerer</label>
      <label><input type="checkbox" data-setting="kind" /> støtter @kind-søk</label>
      <label><input type="checkbox" data-setting="search" /> støtter applyObjectSearch</label>
    </div>
    <div id="camera"></div>
    <div id="view"></div>
    <ol id="calls" reversed></ol>
  </div>

  <script src="../vendor/streambim-widget-api.min.js"></script>
  <script src="mock-model.js"></script>
  <script src="mock-api.js"></script>
  <script src="mock-host.js"></script>
</body>
</html>
